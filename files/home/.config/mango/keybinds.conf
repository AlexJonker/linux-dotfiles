#####################
# KEYBINDS
#####################

# Reload / quit
bind=SUPER,r,reload_config
# bind=SUPER+SHIFT,e,quit

# Mouse — window manipulation
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Apps
bind=SUPER,T,spawn,foot
bind=SUPER,E,spawn,thunar
bind=SUPER,B,spawn,waterfox
bind=SUPER,space,spawn,zlaunch toggle
bind=SUPER,V,spawn_shell,zlaunch toggle -m clipboard
bind=SUPER,period,spawn_shell,zlaunch toggle -m emoji

# Lock screen
bind=SUPER,L,spawn,veila lock

# Kill / quit
bind=SUPER,Q,killclient

# Overview
bind=SUPER,O,toggleoverview
bind=Super,Tab,overcircle,next
bind=ALT,TAB,overcircle,next

# Fullscreen / floating / tabbed
bind=SUPER,F,togglemaximizescreen
bind=SUPER+SHIFT,F,togglefullscreen
bind=SUPER,G,togglefloating
bind=SUPER+SHIFT,V,spawn,mmsg -d toggleoverlay

# Special tag
bind=SUPER+SHIFT,S,tag_special_tag
bind=SUPER,S,toggle_special_tag

#####################
# FOCUS
#####################
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# Vim-style focus
bind=SUPER+ALT,h,focusdir,left
bind=SUPER+ALT,l,focusdir,right
bind=SUPER+ALT,k,focusdir,up
bind=SUPER+ALT,j,focusdir,down


#####################
# MOVE WINDOWS
#####################
bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Right,exchange_client,right
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,Down,exchange_client,down

bind=SUPER+CTRL,h,exchange_client,left
bind=SUPER+CTRL,l,exchange_client,right
bind=SUPER+CTRL,k,exchange_client,up
bind=SUPER+CTRL,j,exchange_client,down

# Move floating windows
# bind=SUPER+CTRL,Left,movewin,-50,+0
# bind=SUPER+CTRL,Right,movewin,+50,+0
# bind=SUPER+CTRL,Up,movewin,+0,-50
# bind=SUPER+CTRL,Down,movewin,+0,+50

# Resize floating windows
bind=SUPER+ALT,Left,resizewin,-50,+0
bind=SUPER+ALT,Right,resizewin,+50,+0
bind=SUPER+ALT,Up,resizewin,+0,-50
bind=SUPER+ALT,Down,resizewin,+0,+50

# Resize scroller column width
bind=SUPER,minus,resizewin,-100,+0
bind=SUPER,equal,resizewin,+100,+0

# Cycle scroller column width presets
bind=SUPER,n,switch_proportion_preset


#####################
# MONITOR FOCUS / MOVE
#####################
bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+SHIFT,Right,focusmon,right
bind=SUPER+SHIFT,Up,focusmon,up
bind=SUPER+SHIFT,Down,focusmon,down

bind=SUPER+SHIFT,h,focusmon,left
bind=SUPER+SHIFT,l,focusmon,right
bind=SUPER+SHIFT,k,focusmon,up
bind=SUPER+SHIFT,j,focusmon,down

bind=SUPER+SHIFT+CTRL,Left,tagmon,left
bind=SUPER+SHIFT+CTRL,Right,tagmon,right
bind=SUPER+SHIFT+CTRL,Up,tagmon,up
bind=SUPER+SHIFT+CTRL,Down,tagmon,down

bind=SUPER+SHIFT+CTRL,h,tagmon,left
bind=SUPER+SHIFT+CTRL,l,tagmon,right
bind=SUPER+SHIFT+CTRL,k,tagmon,up
bind=SUPER+SHIFT+CTRL,j,tagmon,down


#####################
# WORKSPACES / TAGS
#####################
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Navigate tags
bind=SUPER,Page_Down,viewtoright_have_client
bind=SUPER,Page_Up,viewtoleft_have_client
bind=SUPER,u,viewtoleft_have_client
bind=SUPER,i,viewtoright_have_client

# Scroll wheel tag navigation
axisbind=SUPER,DOWN,viewtoright
axisbind=SUPER,UP,viewtoleft
axisbind=SUPER+CTRL,DOWN,tagtoright
axisbind=SUPER+CTRL,UP,tagtoleft

# Horizontal scroll — focus columns (scroller)
axisbind=SUPER,RIGHT,focusdir,right
axisbind=SUPER,LEFT,focusdir,left
axisbind=SUPER+CTRL,RIGHT,exchange_client,right
axisbind=SUPER+CTRL,LEFT,exchange_client,left

# Touchpad scroll
gesturebind=none,left,3,focusdir,right
gesturebind=none,right,3,focusdir,left
gesturebind=none,up,3,viewtoright
gesturebind=none,down,3,viewtoleft


#####################
# MEDIA / SYSTEM
#####################
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl s 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 5%-
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPause,spawn,playerctl play-pause
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPrev,spawn,playerctl previous

# Laptop lid
switchbind=fold,spawn,veila lock

# Screenshots
bind=NONE,Print,spawn,~/.config/mango/scripts/screenshot.sh
